<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Robot das Bolhas 🫧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🤖 Robot das Bolhas 🫧</h1>
  <p class="instrucoes">Move-te e dispara bolhas! Apanha 🍪 e destrói 💣</p>
  
  <div id="hud">
    <span id="score">Pontos: 0</span>
    <span id="lives">Vidas: ❤️❤️❤️</span>
  </div>
  
  <div id="game">
    <div id="robot">🤖</div>
  </div>

  <!-- Controlos para o telemóvel -->
  <div id="controls">
    <div class="dpad">
      <button class="btn" id="btn-up">⬆️</button>
      <div class="row">
        <button class="btn" id="btn-left">⬅️</button>
        <button class="btn" id="btn-down">⬇️</button>
        <button class="btn" id="btn-right">➡️</button>
      </div>
    </div>
    <button class="btn shoot" id="btn-shoot">🫧 Atirar</button>
  </div>

  <div id="gameover" class="hidden">
    <h2>Game Over!</h2>
    <p>Fizeste <span id="finalScore">0</span> pontos</p>
    <button onclick="location.reload()">Jogar de novo</button>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
